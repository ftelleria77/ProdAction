; ============================================================================
; emisor_iso.cfg — el CUARTO ORIGEN del ISO
; ============================================================================
;
; Los otros tres orígenes son archivos que ya existen: el programa (`.pgmx`), la
; configuración de máquina (los `.cfg` del CNC, en `snapshot/`) y la de la
; aplicación (`UI00.exe.Config`). Este cuarto no existía: son las líneas que
; pone el generador ISO de Xilog Plus y que no salen de ningún archivo.
;
; Sin este archivo, esas líneas tendrían que vivir escritas dentro del
; converter — que es lo que la regla 4 del CLAUDE.md prohíbe. Acá son DATO: se
; leen, se comparan contra la máquina y se cambian sin tocar código.
;
; ----------------------------------------------------------------------------
; FORMATO — el de los `.cfg` de Xilog, con una regla prestada
; ----------------------------------------------------------------------------
;
; Una clave `$NOMBRE`, sus líneas, y un `$` que cierra. Todo lo que está FUERA
; de un bloque es comentario y se ignora; por eso este encabezado no necesita
; marca especial.
;
; Dentro de un bloque rige **la misma regla de emisión que el emisor aplica al
; NCI.CFG**: la línea se corta en el primer `;`, y lo que quedó antes se emite
; TAL CUAL, con sus espacios. Ahí está el motivo de usarla:
;
;     G71 ;              ->  "G71 "     (el espacio final queda protegido)
;     M2  ;              ->  "M2  "     (dos espacios)
;     SYN                ->  "SYN"      (sin espacio: no hace falta proteger)
;
; Las líneas 9 a 43 del ISO llevan un espacio al final, la 22 no lleva ninguno
; y la 43 lleva dos. **Es parte del byte**: sin el `;` que los cierra, el primer
; editor con «quitar espacios finales» los borraría en silencio y el
; byte-idéntico se rompería sin que nadie lo note.
;
; Para escribir un `;` literal —lo necesita la línea del header— se duplica:
;
;     ;;H DX=... ;       ->  ";H DX=... "
;
; DIFERENCIA con el NCI.CFG, a propósito: acá el `%` NO se duplica. En aquel
; archivo el `%%` existe porque sus líneas pasan por un printf del emisor; las
; nuestras no pasan por ninguno.
;
; Un `<marcador>` que ocupa una línea entera y se expande a nada **no deja
; línea vacía**; si se expande a varias, entran todas.
;
; ENCODING: este archivo va en UTF-8, porque es nuestro y tiene acentos. Los
; `.cfg` de la máquina son cp1252 y el ISO de salida también, pero las líneas
; del esqueleto son ASCII puro: no hay nada que se pierda en la traducción.
;
; ----------------------------------------------------------------------------
; LOS MARCADORES, Y DE QUÉ ORIGEN SALE CADA UNO
; ----------------------------------------------------------------------------
;
;   <nombre_del_archivo>     PROGRAMA   el nombre del .pgmx, en minúsculas
;   <dx> <dy> <dz>           PROGRAMA   dimensión + origen de cada eje
;   <bx> <by> <bz>           PROGRAMA   traslación de la pieza respecto al tope
;   <area>                   PROGRAMA   el área de ejecución, dos letras
;   <v> <c> <t>              PROGRAMA   bloqueo, ciclo continuo, opc. mecánicas
;   <nci_gen_init>           MÁQUINA    bloque $GEN_INIT de NCI.CFG
;   <nci_gen_end>            MÁQUINA    bloque $GEN_END de NCI.CFG
;   <of_x> <of_y> <of_z>     DERIVADO   origen en micras (fórmula B1c)
;   <shf_x> <shf_y> <shf_z>  DERIVADO   el mismo origen, en milímetros
;   <edk_mitad_mesa>         DERIVADO   10 mitad izquierda · 13 mitad derecha
;   <cuerpo>                 PROGRAMA   operaciones de máquina y mecanizados
;
; El orden de los campos del header es del EMISOR, no del programa: el XXL que
; produce Maestro los escribe en otro orden y con dos campos más (`R` y el
; equipamiento `/"def"`), que el paso a ISO descarta.
;
; ----------------------------------------------------------------------------
; PROCEDENCIA
; ----------------------------------------------------------------------------
;
; Derivado del ISO del programa vacío postprocesado en la PC del CNC
; (`docs/experiments/evidencia/paso0_cnc/r_pv_manual_base_cnc.iso`): 43 líneas,
; cp1252, CRLF, terminado con CRLF.
;
;   Maestro          1.00.006.1009
;   generador ISO    Xilog Plus, binarios del 2011-11-18
;                    (PostISO.dll, PlPathFilter32.dll, VtGenIso.dll, nci32.dll)
;   control (CNC)    ESA-GV  ->  dialecto ISO-ESAGV(2)
;
; El DIALECTO importa tanto como la build (agregado 2026-08-14). `PostISO.dll`
; sabe emitir CUATRO: ISO-OSAI(2), ISO-ESAGV(2), ISO-NUM e ISO-ORCHESTRA. Este
; esqueleto es el de ESA-GV, derivado de que el ISO usa `ETK`/`EDK` — que es la
; forma ESA-GV de las variables `E..`, según la guía de diagnóstico de SCM
; 9031191610B v4.2, cap. 7 y 32. La clave que elige el dialecto es `[CNCNAME]`
; de `Nci.ini`, y en esta máquina está VACÍA: se emite el default.
;
; Contra una máquina con otro control, este archivo entero no vale.
;
; La otra PC del taller tiene binarios distintos (2011-10-14) y NO genera ISO.
; Si algún día lo hiciera, hay que verificar este archivo contra su salida.
;
; ----------------------------------------------------------------------------
; LO QUE ESTE ARCHIVO TODAVÍA NO SABE
; ----------------------------------------------------------------------------
;
; - `*MM` y `G71` están literales, y el fixture en pulgadas (2026-08-22) dice que
;   está bien: con la unidad puesta en Pulgadas, el ISO sale IDÉNTICO. La opción
;   no produce pulgadas en el ISO, así que el literal es correcto.
;   ⚠️ Negativo SIN TESTIGO: el `.pgmx` también quedó idéntico, o sea que el
;   archivo no puede probar que la opción estaba puesta. Fermín reinició Maestro a
;   propósito para aplicarla, así que es probable — pero no está cerrado.
; - El bloque del `Xn` no está acá TODAVÍA, pero ya no por falta de origen: el
;   `Z201.000` resultó ser `AP_PARKQTA` del eje Z de `Params.cfg` (derivado el
;   2026-08-20, ver `experiments/operaciones_maquina.md` §5). Es configuración de
;   máquina, así que cuando entre, entra como los demás valores de máquina y NO
;   como literal. Lo mismo el `X`, que sale del `.pgmx`.
;   ⚠️ Y ojo con la forma: el `?%ETK[8]=1` + `G40` que lo abren son PREÁMBULO del
;   bloque de operaciones, no del `Xn` — se emiten UNA vez aunque haya varias. El
;   cuerpo del `Xn` son SEIS líneas, y el del segundo `Xn` en adelante, CINCO.
; - `?%EDK[0].0` y `?%EDK[1].0` van con valor 0 fijo: el único observado.
; - ⚠️ `?%ETK[8]=1` NO ES CONSTANTE (2026-08-14). Pertenece a la banda del CAMBIO
;   DE HERRAMIENTA (`ETK 6-12`, guía SCM 9031191610B cap. 32), y en los ISO con
;   mecanizado alterna 1 y 2 dentro de un mismo programa. Acá vale 1 porque el
;   programa vacío no cambia de herramienta. EN CUANTO EL CUERPO TENGA MÁS DE UNA
;   HERRAMIENTA, ESTA LÍNEA HAY QUE DERIVARLA, NO COPIARLA.
;   Dato del 2026-08-22: en los 60 fixtures de operaciones —incluidos los que
;   cambian de herramienta— sigue valiendo 1. El valor 2 sólo se vio en los ISO de
;   muestra de la instalación. Así que el 1 aguanta más de lo que se temía, pero
;   sigue sin derivarse qué lo mueve.
; ============================================================================

$EMI_ESQUELETO
% <nombre_del_archivo>.pgm
;;H DX=<dx> DY=<dy> DZ=<dz> BX=<bx> BY=<by> BZ=<bz> -<area> V=<v> *MM C=<c> T=<t> ;
<nci_gen_init>
G71 ;
MLV=0 ;
%Or[0].ofX=<of_x> ;
%Or[0].ofY=<of_y> ;
%Or[0].ofZ=<of_z> ;
?%EDK[0].0=0 ;
?%EDK[1].0=0 ;
MLV=1 ;
SHF[X]=<shf_x> ;
SHF[Y]=<shf_y> ;
SHF[Z]=<shf_z>+%ETK[114]/1000 ;
?%ETK[8]=1 ;
G40 ;
<cuerpo>
SYN
<nci_gen_end>
?%EDK[<edk_mitad_mesa>].0=1 ;
MLV=1 ;
SHF[X]=0 ;
SHF[Y]=0 ;
SHF[Z]=0 ;
MLV=2 ;
SHF[X]=0 ;
SHF[Y]=0 ;
SHF[Z]=0 ;
MLV=0 ;
VL6=0 ;
VL7=0 ;
?%EDK[<edk_mitad_mesa>].0=0 ;
M2  ;
$

; Estacionamiento automático al terminar: dos líneas que el `.pgmx` NO pide.
; Las agrega el postprocesador cuando `IsFinalPark=True` en la ventana Opciones
; (origen APLICACIÓN) y van dentro de `<cuerpo>`, entre el `G40` y el `SYN` —
; el mismo punto donde el `Xn` mete su bloque. Derivado de los fixtures `eafe_*`.
;
; Ojo con la segunda: es la misma instrucción que la tercera del `$GEN_INIT`,
; pero con DOS espacios finales, mientras aquella no tiene ninguno.
;
; ⚠️ ESTE BLOQUE NO ES FIJO: DEPENDE DEL CAMPO (derivado el 2026-08-22).
;   El de abajo es el del campo HG. En campo AB, Maestro emite TRES líneas y usa
;   OTRO parámetro de eje:
;
;     _paras( 0x00, X, 3, %ax[0].pa[21]/1000, %ax[0].pa[22]/1000 )
;     G0G53 X%ax0.pa31/1000 Y%ax1.pa22/1000        <-- pa31, no pa21
;     _paras( 0x00, X, 3, %ax[0].pa[21]/1000, %ETK[500] )
;
;   Con dos campos no alcanza para saber la regla, así que el bloque queda como
;   está —el de HG, que es donde se derivó todo lo demás— y la variante queda
;   escrita acá para que el hueco viaje con el dato.
;
; Y una unificación: el «Aparcamiento» de la UI (`Park`, una operación de máquina
; que el usuario pone en la lista) emite EXACTAMENTE ESTE MISMO BLOQUE. No son dos
; cosas: es la misma, una manual y otra que agrega la aplicación al terminar.

$EMI_PARK_FINAL
G0G53 X%ax0.pa21/1000 Y%ax1.pa22/1000  ;
_paras( 0x00, X, 3, %ax[0].pa[21]/1000, %ETK[500] )  ;
$
