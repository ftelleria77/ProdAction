; Configuracion del runner de la suite.
;
; `pythonpath = .` pone la raiz del repo en sys.path durante la coleccion. Sin
; esto, el ejecutable `pytest` a secas falla con ~60 errores de coleccion
; (`import app`, `import pgmx`, `import iso` no resuelven) y solo funciona la
; forma `py -3 -m pytest`, porque el `-m` agrega el cwd por su cuenta. Con esta
; clave las dos formas de invocarlo dan el mismo resultado.

[pytest]
pythonpath = .
testpaths = tests
